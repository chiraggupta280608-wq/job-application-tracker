<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JobTracker SaaS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    </div>
                    <span class="brand-name" style="color:var(--text-primary);font-size:1.35rem;font-weight:800;">Job<span class="brand-accent">Tracker</span></span>
                </a>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to manage your applications and jobs</p>
            </div>

            <form id="loginForm" class="form-layout" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">
                        Email Address <span class="required-star">*</span>
                    </label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" autocomplete="email" required>
                    <div class="form-feedback error-feedback" id="emailError"></div>
                </div>

                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <label class="form-label" for="password">
                            Password <span class="required-star">*</span>
                        </label>
                    </div>
                    <div class="password-input-group">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="form-feedback error-feedback" id="passwordError"></div>
                </div>

                <button type="submit" id="submitLoginBtn" class="btn btn-primary" style="width:100%;padding:12px;margin-top:6px;">
                    Sign In to Dashboard
                </button>
            </form>

            <div class="demo-account-box">
                <div class="demo-account-title">Demo Credentials (Quick Testing)</div>
                <div class="demo-credential-chip">
                    <div>User: <code>demo@jobtracker.com</code> / <code>password123</code></div>
                    <button type="button" class="btn-fill-demo" onclick="Auth.fillDemoUser('demo@jobtracker.com', 'password123')">Fill</button>
                </div>
                <div class="demo-credential-chip">
                    <div>Admin: <code>admin@jobtracker.com</code> / <code>adminpassword</code></div>
                    <button type="button" class="btn-fill-demo" onclick="Auth.fillDemoUser('admin@jobtracker.com', 'adminpassword')">Fill</button>
                </div>
            </div>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html">Create Account</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const theme = Storage.getTheme();
            if (theme === 'dark') document.body.classList.add('dark-mode');
            Auth.initLogin();
        });
    </script>
</body>
</html>
