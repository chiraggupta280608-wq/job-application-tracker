<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - JobTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="app-container">
        <!-- Sidebar Shell -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Layout -->
        <main class="main-content">
            <!-- Topbar Shell -->
            <header class="top-bar" id="topBar"></header>

            <div class="content-area">
                <!-- Page Header -->
                <div class="page-header">
                    <div class="page-header-text">
                        <h2>Job Opportunities</h2>
                        <p>Discover, manage, and apply to curated job opportunities.</p>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="JobsPage.openAddJobModal()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Post New Job
                    </button>
                </div>

                <!-- Search & Filters Toolbar -->
                <div class="filter-toolbar">
                    <div class="search-box-wrap">
                        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="jobSearchInput" class="search-input" placeholder="Search by title, company, skills, or location...">
                    </div>

                    <select id="filterJobType" class="filter-select">
                        <option value="">All Job Types</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Internship">Internship</option>
                        <option value="Remote">Remote</option>
                    </select>

                    <select id="filterLocation" class="filter-select">
                        <option value="">All Locations</option>
                    </select>

                    <select id="sortJobsBy" class="filter-select">
                        <option value="latest">Sort: Newest First</option>
                        <option value="oldest">Sort: Oldest First</option>
                        <option value="company-asc">Company: A to Z</option>
                        <option value="company-desc">Company: Z to A</option>
                    </select>

                    <button type="button" class="btn btn-secondary btn-sm" onclick="JobsPage.clearFilters()">Clear</button>
                </div>

                <!-- Jobs Count Header -->
                <div style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:0.9rem;font-weight:600;color:var(--text-secondary);" id="jobResultsCount">Showing 0 jobs</span>
                </div>

                <!-- Jobs Grid -->
                <div class="jobs-grid" id="jobsGridContainer">
                    <!-- Populated by JS -->
                </div>

                <!-- Empty State -->
                <div id="noJobsFound" class="empty-state card" style="display:none;margin-top:20px;">
                    <div class="empty-state-icon">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    </div>
                    <div class="empty-state-title">No jobs match your search</div>
                    <p class="empty-state-desc">Try clearing your search terms or filters to view available postings.</p>
                    <button class="btn btn-secondary btn-sm" onclick="JobsPage.clearFilters()">Clear All Filters</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Job Modal -->
    <div class="modal-backdrop" id="jobModal">
        <div class="modal-box" style="max-width: 650px;">
            <div class="modal-header">
                <h3 class="modal-title" id="jobModalTitle">Add Job Opportunity</h3>
                <button type="button" class="modal-close-btn" onclick="JobsPage.closeJobModal()">&times;</button>
            </div>
            <form id="jobForm" novalidate>
                <div class="modal-body form-layout">
                    <input type="hidden" id="jobId">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="companyName">Company Name <span class="required-star">*</span></label>
                            <input type="text" id="companyName" class="form-control" placeholder="e.g. Acme Corp" required>
                            <div class="form-feedback error-feedback" id="companyNameError"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="jobTitle">Job Title <span class="required-star">*</span></label>
                            <input type="text" id="jobTitle" class="form-control" placeholder="e.g. Senior Frontend Engineer" required>
                            <div class="form-feedback error-feedback" id="jobTitleError"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="jobLocation">Location <span class="required-star">*</span></label>
                            <input type="text" id="jobLocation" class="form-control" placeholder="e.g. New York, NY / Remote" required>
                            <div class="form-feedback error-feedback" id="jobLocationError"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="jobType">Job Type <span class="required-star">*</span></label>
                            <select id="jobType" class="form-control" required>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Internship">Internship</option>
                                <option value="Remote">Remote</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="salaryRange">Salary Range</label>
                            <input type="text" id="salaryRange" class="form-control" placeholder="e.g. $120,000 - $160,000">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="applicationDeadline">Application Deadline</label>
                            <input type="date" id="applicationDeadline" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="companyWebsite">Company Website URL</label>
                        <input type="url" id="companyWebsite" class="form-control" placeholder="https://company.com/careers">
                        <div class="form-feedback error-feedback" id="companyWebsiteError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="requiredSkills">Required Skills (Comma-separated)</label>
                        <input type="text" id="requiredSkills" class="form-control" placeholder="e.g. JavaScript, React, CSS, Node.js">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="jobDescription">Job Description <span class="required-star">*</span></label>
                        <textarea id="jobDescription" class="form-control" placeholder="Describe the responsibilities, requirements, and benefits..." required></textarea>
                        <div class="form-feedback error-feedback" id="jobDescriptionError"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="JobsPage.closeJobModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveJobBtn">Save Job</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Job Description & Details Modal -->
    <div class="modal-backdrop" id="viewJobModal">
        <div class="modal-box" style="max-width: 650px;">
            <div class="modal-header">
                <h3 class="modal-title" id="viewJobModalTitle">Job Description</h3>
                <button type="button" class="modal-close-btn" onclick="JobsPage.closeViewJobModal()">&times;</button>
            </div>
            <div class="modal-body" id="viewJobModalBody">
                <!-- Injected by JS -->
            </div>
            <div class="modal-footer" id="viewJobModalFooter">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/jobs.js"></script>
</body>
</html>
