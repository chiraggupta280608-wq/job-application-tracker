<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - JobTracker SaaS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    </div>
                    <span class="brand-name" style="color:var(--text-primary);font-size:1.35rem;font-weight:800;">Job<span class="brand-accent">Tracker</span></span>
                </a>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join thousands of job seekers organizing their career</p>
            </div>

            <form id="registerForm" class="form-layout" novalidate>
                <div class="form-group">
                    <label class="form-label" for="fullName">
                        Full Name <span class="required-star">*</span>
                    </label>
                    <input type="text" id="fullName" class="form-control" placeholder="Jane Doe" required>
                    <div class="form-feedback error-feedback" id="fullNameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">
                        Email Address <span class="required-star">*</span>
                    </label>
                    <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
                    <div class="form-feedback error-feedback" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">
                        Password (min. 6 characters) <span class="required-star">*</span>
                    </label>
                    <div class="password-input-group">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="form-feedback error-feedback" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        Confirm Password <span class="required-star">*</span>
                    </label>
                    <div class="password-input-group">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" data-target="confirmPassword" aria-label="Toggle confirm password visibility">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="form-feedback error-feedback" id="confirmPasswordError"></div>
                </div>

                <button type="submit" id="submitRegisterBtn" class="btn btn-primary" style="width:100%;padding:12px;margin-top:6px;">
                    Create Free Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const theme = Storage.getTheme();
            if (theme === 'dark') document.body.classList.add('dark-mode');
            Auth.initRegister();
        });
    </script>
</body>
</html>
